<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeuroBoard</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70;
    --tile: #ffffff; --tile-border: #d9d6cf; --row: #fff3c4; --focus: #e8590c;
    --help: #c92a2a; --help-bg: #fff0f0; --ok: #2b8a3e; --bar: #3b5bdb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416; --panel: #1f1f23; --ink: #f2f2f4; --muted: #a0a0a8;
      --tile: #26262b; --tile-border: #3a3a41; --row: #3d3517; --focus: #ff922b;
      --help: #ff6b6b; --help-bg: #3a1d1d; --ok: #51cf66; --bar: #748ffc;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 18px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center;
           padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--tile-border); }
  h1 { font-size: 20px; margin: 0; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); }
  .meter { flex: 1; min-width: 160px; max-width: 320px; }
  .meter-label { font-size: 13px; color: var(--muted); }
  .meter-track { height: 10px; background: var(--tile-border); border-radius: 5px; overflow: hidden; }
  .meter-fill { height: 100%; width: 0; background: var(--bar); transition: width .2s; }
  .controls { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); }
  .message { margin: 16px; padding: 14px 18px; min-height: 64px; background: var(--panel);
             border: 1px solid var(--tile-border); border-radius: 12px; font-size: 26px; }
  .message .hint { color: var(--muted); font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 0 16px 16px; }
  .tile { background: var(--tile); border: 3px solid var(--tile-border); border-radius: 14px;
          min-height: 120px; display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 6px; font-size: 22px; font-weight: 600; cursor: pointer;
          transition: transform .1s, background .1s; text-align: center; padding: 8px; color: var(--ink); }
  .tile .icon { font-size: 40px; line-height: 1; }
  .tile.help { border-color: var(--help); color: var(--help); background: var(--help-bg); }
  .tile.row-on { background: var(--row); }
  .tile.focus { border-color: var(--focus); outline: 5px solid var(--focus); transform: scale(1.04); }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
             align-items: center; justify-content: center; padding: 16px; }
  .overlay.show { display: flex; }
  .dialog { background: var(--panel); border-radius: 16px; padding: 28px; max-width: 520px;
            text-align: center; border: 4px solid var(--help); }
  .dialog h2 { margin: 0 0 8px; color: var(--help); font-size: 28px; }
  .countdown { font-size: 56px; font-weight: 700; margin: 8px 0; }
  footer { padding: 0 16px 16px; color: var(--muted); font-size: 14px; }
  kbd { border: 1px solid var(--tile-border); border-radius: 4px; padding: 0 5px; }
  @media (max-width: 600px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .tile { min-height: 96px; font-size: 18px; }
  }
</style>
</head>
<body>
<header>
  <h1>NeuroBoard</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Headset not connected</span></div>
  <div class="meter">
    <div class="meter-label" id="meterLabel">Switch signal</div>
    <div class="meter-track"><div class="meter-fill" id="meterFill"></div></div>
  </div>
  <label class="controls">Scan speed
    <input type="range" id="speed" min="600" max="3000" step="100" value="1500">
    <span id="speedVal">1.5s</span>
  </label>
</header>

<div class="message" id="message"><span class="hint">Select a tile with your switch.</span></div>
<div class="grid" id="grid"></div>
<footer>Testing without the headset: press <kbd>Space</kbd> to select, or click a tile.</footer>

<div class="overlay" id="overlay">
  <div class="dialog">
    <h2>Send help alert?</h2>
    <div>Select again to confirm.</div>
    <div class="countdown" id="countdown">5</div>
    <div>Cancels automatically if you do nothing.</div>
  </div>
</div>

<script>
// ---------------------------------------------------------------- board content
// Edit these to change the board. `confirm: true` asks for a second selection first.
const TILES = [
  { label: "Yes",          icon: "👍", say: "Yes" },
  { label: "No",           icon: "👎", say: "No" },
  { label: "Help",         icon: "🆘", say: "I need help, please.", confirm: true },
  { label: "Thank you",    icon: "🙏", say: "Thank you" },
  { label: "Water",        icon: "💧", say: "Can I have some water, please?" },
  { label: "Food",         icon: "🍽️", say: "I'm hungry." },
  { label: "Bathroom",     icon: "🚻", say: "I need to use the bathroom." },
  { label: "Pain",         icon: "🤕", say: "I'm in pain." },
  { label: "Tired",        icon: "😴", say: "I'm tired. I'd like to rest." },
  { label: "Cold",         icon: "🥶", say: "I'm cold." },
  { label: "Hot",          icon: "🥵", say: "I'm too warm." },
  { label: "Call family",  icon: "📞", say: "Please call my family." },
];
const COLS = 4;

// ---------------------------------------------------------------- scanning state
const grid = document.getElementById("grid");
const els = TILES.map((t, i) => {
  const d = document.createElement("div");
  d.className = "tile" + (t.confirm ? " help" : "");
  d.innerHTML = `<span class="icon" aria-hidden="true">${t.icon}</span><span>${t.label}</span>`;
  d.onclick = () => activate(i);
  grid.appendChild(d);
  return d;
});
const nRows = Math.ceil(TILES.length / COLS);
let mode = "rows";        // "rows" -> "cols" -> activate -> "rows"
let row = 0, col = 0, colPasses = 0;
let timer = null, lastSelect = 0;
let confirmTile = null, confirmTimer = null, confirmLeft = 0;
const log = [];           // selection history: [{time, label}]

function rowTiles(r) { return els.slice(r * COLS, r * COLS + COLS); }

function render() {
  els.forEach(e => e.classList.remove("row-on", "focus"));
  if (confirmTile !== null) { els[confirmTile].classList.add("focus"); return; }
  if (mode === "rows") rowTiles(row).forEach(e => e.classList.add("row-on"));
  else {
    rowTiles(row).forEach(e => e.classList.add("row-on"));
    els[row * COLS + col].classList.add("focus");
  }
}

function step() {
  if (confirmTile !== null) return;
  if (mode === "rows") {
    row = (row + 1) % nRows;
  } else {
    col++;
    if (col >= rowTiles(row).length) {     // went past the end of the row
      col = 0;
      if (++colPasses >= 2) { mode = "rows"; colPasses = 0; }  // nothing chosen: back to rows
    }
  }
  render();
}

function restartTimer() {
  clearInterval(timer);
  timer = setInterval(step, Number(speed.value));
}

// One switch press. Called by the headset (via the server), Space key, or confirm flow.
function select() {
  const now = Date.now();
  if (now - lastSelect < 400) return;     // ignore double-fires
  lastSelect = now;
  if (confirmTile !== null) { finishConfirm(true); return; }
  if (mode === "rows") { mode = "cols"; col = 0; colPasses = 0; }
  else { activate(row * COLS + col); return; }
  render(); restartTimer();
}

function activate(i) {
  const t = TILES[i];
  if (t.confirm && confirmTile === null) { startConfirm(i); return; }
  speak(t.say);
  showMessage(t.say);
  log.push({ time: new Date().toISOString(), label: t.label });
  flash(i);
  mode = "rows"; row = 0;
  render(); restartTimer();
}

// ---------------------------------------------------------------- confirm-before-alert
const overlay = document.getElementById("overlay");
const countdown = document.getElementById("countdown");
function startConfirm(i) {
  confirmTile = i; confirmLeft = 5;
  countdown.textContent = confirmLeft;
  overlay.classList.add("show");
  speak("Send help alert? Select again to confirm.");
  render();
  confirmTimer = setInterval(() => {
    countdown.textContent = --confirmLeft;
    if (confirmLeft <= 0) finishConfirm(false);
  }, 1000);
}
function finishConfirm(confirmed) {
  clearInterval(confirmTimer);
  overlay.classList.remove("show");
  const i = confirmTile; confirmTile = null;
  if (confirmed) {
    const t = TILES[i];
    speak(t.say);
    showMessage(t.say + "  (Demo: alert sent to caregiver)");
    log.push({ time: new Date().toISOString(), label: t.label + " (confirmed)" });
    onHelpConfirmed(t);
  } else {
    showMessage("Help alert cancelled.");
  }
  mode = "rows"; row = 0; render(); restartTimer();
}
// Hook for your automation: text a caregiver, call a webhook, etc. Never dial 911 in a demo.
function onHelpConfirmed(tile) {
  if (location.protocol.startsWith("http")) fetch("/alert", { method: "POST" }).catch(() => {});
}

// ---------------------------------------------------------------- output
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}
function showMessage(text) { document.getElementById("message").textContent = text; }
function flash(i) {
  els[i].animate([{ transform: "scale(1.12)" }, { transform: "scale(1)" }], { duration: 350 });
}

// ---------------------------------------------------------------- inputs
const speed = document.getElementById("speed");
const speedVal = document.getElementById("speedVal");
speed.oninput = () => { speedVal.textContent = (speed.value / 1000).toFixed(1) + "s"; restartTimer(); };

document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); select(); }
});

// Headset events from board_server.py (Server-Sent Events)
const dot = document.getElementById("dot");
const statusText = document.getElementById("statusText");
const meterFill = document.getElementById("meterFill");
const meterLabel = document.getElementById("meterLabel");
if (location.protocol.startsWith("http")) {
  const es = new EventSource("/events");
  es.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "select") select();
    else if (m.type === "status") {
      dot.classList.toggle("on", !!m.eeg);
      statusText.textContent = m.msg;
    } else if (m.type === "probs") {
      meterFill.style.width = Math.round(m.p * 100) + "%";
      meterLabel.textContent = `Switch signal (${m.label}): ${Math.round(m.p * 100)}%`;
    }
  };
  es.onerror = () => { dot.classList.remove("on"); statusText.textContent = "Server disconnected"; };
} else {
  statusText.textContent = "Open via board_server.py to use the headset";
}

render(); restartTimer();
</script>
</body>
</html>
